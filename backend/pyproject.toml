[project]
name = "brahmaniss"
version = "0.1.0"
description = "Evidence-first code discovery for new contributors"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-php>=0.23.11,<0.24",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-swift>=0.7.4",
    "tree-sitter-typescript>=0.23.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:Use the progress_callback:DeprecationWarning",
]
